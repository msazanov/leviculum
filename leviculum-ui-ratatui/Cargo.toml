[package]
name = "leviculum-ui-ratatui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ratatui widgets and terminal shell shared by the Leviculum terminal programs"
# A library for the workspace's own programs, not published on its own.
publish = false

[lints.rust]
unsafe_code = "forbid"

[features]
# Inline pictures: the protocol detection, the encoder and the cropped draw.
# Off by default; a program that shows no pictures does not carry a decoder.
images = ["dep:ratatui-image", "dep:image"]

[dependencies]
leviculum-ui = { path = "../leviculum-ui" }
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
termbg = "0.6.2"
# `default-features = false` is not optional for ratatui-image: the default
# `chafa-dyn` feature makes the build probe for libchafa via pkg-config, which
# would put a C library in the path of the musl-static .deb. Without it the
# crate is pure Rust and still carries Kitty, iTerm2, Sixel (icy_sixel) and
# Unicode halfblocks, which is the whole fallback ladder we need. `image` is
# decoding only, the three codecs lnomad's own dependency names: each extra
# decoder is attack surface for bytes handed to us by a stranger's node.
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }

[dev-dependencies]
# The crossterm backend, for the test that holds `leviculum_ui::input`'s
# key-to-edit table to the one this backend carries.
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
