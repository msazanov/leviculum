[package]
name = "loquax-android"
# The app's own version, like loquax's: it tracks the Android frontend, not
# the protocol core underneath.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "loquax on Android: the JNI library the app's Java calls"
publish = false

# A cdylib for the app (`make` in this directory builds it for Android and
# puts it in the APK), an rlib so the host's `cargo test` runs its tests.
# Not a default member: on the workspace's musl default cargo drops the
# cdylib with a warning, as for leviculum-ffi.
[lib]
name = "loquax_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The messenger core and shell with the store (`history`, SQLite built by
# the NDK's clang), without a terminal: what a home node client needs
# (docs/drafts/loquax-android-2026-10.md, option A).
# With `screenmap` and `mapload` for the map screen (1128): loquax's own
# map on a pixel screen, the picture, its names in Fira Sans and the pins,
# drawn here and hosted by Java as a bitmap, and the autoload into the
# app's maps directory. One renderer for the terminal's pictures, the
# window and the phone.
# With `qr` for the contact screen's address code (1146).
loquax = { path = "../loquax", features = ["history", "screenmap", "mapload", "qr"] }
# The map's types the screen's call passes to loquax's.
leviculum-map = { path = "../leviculum-map", features = ["std"] }
leviculum-mapfill = { path = "../leviculum-mapfill" }
# The types the session hands loquax's model and engine, at the versions
# loquax uses.
leviculum-core = { path = "../leviculum-core" }
leviculum-lxmf = { path = "../leviculum-lxmf", default-features = false, features = ["pow"] }
leviculum-std = { path = "../leviculum-std" }
leviculum-ui = { path = "../leviculum-ui", default-features = false }
# The admission token the phone's own mailbox issues its screens (1152).
rand_core = { workspace = true, features = ["getrandom"] }
# The runtime the leaf node and the session's runners run on.
tokio.workspace = true
tracing.workspace = true
# The JNI payloads (src/schema.rs): msgpack maps, as the study chose.
serde.workspace = true
rmp-serde.workspace = true
# The safe JNI layer: `EnvUnowned::with_env` catches a panic before it
# crosses into the Java VM. Already in the lock through winit.
jni = { version = "0.22.4", default-features = false }

[dev-dependencies]
# The end-to-end test runs its transport node and home node on tokio's
# test runtime.
tokio = { workspace = true, features = ["full"] }
rand_core = { workspace = true, features = ["getrandom"] }
tempfile = "3"
# The Python LXMF peer's JSON-RPC (loquax/tests/support/python_peer.rs).
serde_json = "1"
# The map's golden is a PNG, and its test turns loquax's Rgb565 picture
# into RGBA as the window does (1128); both in the lock through loquax.
png = "0.18"
embedded-graphics = "0.8"
