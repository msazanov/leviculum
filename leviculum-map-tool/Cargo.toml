[package]
name = "leviculum-map-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cuts a map region file from a Protomaps PMTiles archive, for leviculum-map (#474)"
# A desktop tool run by hand; no package ships it and nothing links it.
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
leviculum-map = { path = "../leviculum-map", features = ["std"] }
# `std` for the fixture writer, which lives beside its reader there.
leviculum-mapfill = { path = "../leviculum-mapfill", features = ["std"] }
embedded-graphics = "0.8"
# The prost-generated MVT types and the geometry decoder the map
# measurement chose (docs/drafts/map-measurement-2026-10.md, "Crates"). They
# stay in this crate: leviculum-map reads only the flat format.
tinymvt = "0.3"
prost = "0.14"
flate2 = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# The allocator lnsd runs on (leviculum-cli/Cargo.toml). The cut allocates
# per feature and per ring on every worker; on musl's allocator a Hessen cut
# spent twice as long in the kernel as in user space.
mimalloc = { version = "0.1", default-features = false }
