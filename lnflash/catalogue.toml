# The board catalogue: every board fact lnflash knows, and nothing about any
# particular firmware release.
#
# Compiled into the binary (`manifest::Catalogue::builtin`). It is here rather
# than in a bundle's manifest.toml because these are properties of the
# hardware, not of a release: which USB IDs an LNode answers on does not change
# when we cut a new firmware, and the sessions that only configure a board that
# is already running — `--set-time`, `--set-telemetry` — need exactly this and
# no image at all (Codeberg #342). Activation is configuration, not firmware
# (#236/#238), so requiring a bundle on disk for it sent people hunting for
# firmware they had no use for.
#
# The bundle's manifest.toml carries the other half: the version, and one
# payload entry per board naming the image and its checksum. Splitting them
# this way keeps one source of truth for each — a board fact is here, a release
# fact is there, and neither is written down twice.
#
# ## The two halves of an entry (Codeberg #233)
#
# A board entry is itself split, because talking to a board and writing to one
# rest on different evidence:
#
# * The **control** half — `candidate_usb` — is what every session that talks
#   to a board that is already up needs: `--watch`, `--announce`, `--set-time`,
#   `--radio-*`, `--set-name`. It is safe on a weak key, because the board
#   answering is a board running our firmware and identifying itself; the worst
#   a wrong ID can do is address nothing.
# * The **flashing** half — `[board.<name>.flashing]` — is what writing an
#   image needs, and it rests on the `Board-ID` the bootloader publishes. It is
#   optional. A board that has none is control-only: no bundle may carry an
#   image for it, `--board <name>` is refused, and a flash session that finds
#   it on the bus says so and leaves it alone.
#
# A board without a flashing half must say why in `not_flashable`, and a board
# may not state both. That is enforced when the catalogue loads, so "control
# only, and here is the reason" cannot decay into an entry somebody widens by
# accident.
#
# The binary stays board-agnostic: an `if board == "t114"` anywhere in the
# source would mean the split has failed. A new nRF or RP2040 board is an entry
# in this file plus an image in the bundle; a new chip family is one new
# transport in Rust (docs/src/concepts/lnode-flashing.md, "Four axes").
#
# The constants below were measured on the rig and are recorded with their
# evidence in docs/src/concepts/lnode-flashing.md.

[board.t114]
family    = "nrf52840"
# Hints for finding candidates, and the whole handle the control commands have.
# Never identity: a running application's USB ID belongs to whatever firmware is
# installed, not to the board. 1209:0001 is ours, 239a:8071 Heltec's stock.
candidate_usb = ["1209:0001", "239a:8071"]

[board.t114.flashing]
level     = "verified"
# `verified`: we own this board and run it. `expected`: wiring checked against
# the vendor reference, never run by us, and lnflash writes it only after a
# person says yes to exactly that (docs/src/firmware/boards.md, "How to read
# the tables"). Required, so no entry can leave the question open.
transport = "uf2-msc"
# Tried in order. The touch only exists if the running firmware implements it;
# ours does, stock Meshtastic does not, so the double-tap is a real fallback.
entry     = ["touch-1200", "double-tap"]

[board.t114.flashing.identify]
# The truth, read from INFO_UF2.TXT after entering the bootloader. Exactly
# this string, not a substring of something longer.
info_uf2_board_id = "HT-n5262"
# USB IDs the bootloader answers on. Stage one only: it says a device is worth
# mounting, never what board it is.
bootloader_usb    = ["239a:0071"]
msc_label         = "HT-n5262"
# A hint, not a decision. Heltec publishes HT-n5262 for the Mesh Node T114, for
# MeshSolar and for the Mesh Pocket, and only the first may take this image:
# the Mesh Pocket wires its radio differently, and on MeshSolar our status LED
# is the battery controller's shutdown input (docs/src/firmware/boards.md,
# family B). The identifier belongs to a bootloader shared across models
# (docs/src/concepts/lnode-flashing.md, "Four axes"), so a match is written
# only under --board t114 or after a person names the board at the prompt.
board_id_shared   = true
board_id_models   = ["Heltec Mesh Node T114", "Heltec MeshSolar", "Heltec Mesh Pocket"]

[board.t114.flashing.flash]
# The bootloader generates CURRENT.UF2 from exactly this window, which is how
# both bounds were measured without reading a single constant.
family_id      = 0xADA52840
writable_start = 0x1000
writable_end   = 0xEA000
app_base       = 0x27000

[board.t114.flashing.requires]
# Our bindings are generated from 7.0.1 and the boards run 7.3.0; Nordic keeps
# the ABI stable within a major version. A board carrying 6.1.1 puts the
# application boundary a page lower, so our image boots into nothing.
softdevice = ">=7.0.1, <8.0.0"

# The RAK4630 module, in every carrier built around it — the WisMesh Pocket V2
# is the one we own (Codeberg #261). One entry serves the whole carrier family
# because the module fixes both halves that matter: the SX1262 wiring is
# internal to it, and so is the bootloader that publishes the Board-ID, so the
# key and the wiring are bound to the same unit
# (docs/src/concepts/board-support-scope.md, "The limit that bites").
[board.rak4631]
family    = "nrf52840"
# Our own firmware's application ID (leviculum-nrf/src/boards/rak4631.rs:125).
# Stock Meshtastic on this board enumerates under some ID of its own, and we
# have not measured which — so it is not listed. Nothing is lost by that: a
# board running Meshtastic answers no 1200-baud touch, so knowing its ID would
# only let us knock on a door that does not open, and the double-tap prompt is
# reached either way.
candidate_usb = ["1209:0002"]

[board.rak4631.flashing]
# Our Pocket V2 and a bare module. Every other carrier of the RAK4630 rides on
# this entry and this level, because the Board-ID and the radio wiring both
# belong to the module (docs/src/firmware/boards.md, family A).
level     = "verified"
transport = "uf2-msc"
# Same two, same order, and for the same reason as the T114: our firmware
# answers the touch, stock Meshtastic does not.
entry     = ["touch-1200", "double-tap"]

[board.rak4631.flashing.identify]
# Verbatim from the INFO_UF2.TXT this board's bootloader publishes, transcribed
# in docs/src/concepts/lnode-flashing.md ("What the bootloader tells you"). The
# same string `just flash-rak4631` passes as LEVICULUM_UF2_BOARD_ID.
info_uf2_board_id = "WisBlock-RAK4631-Board"
# Measured on the rig, docs/src/concepts/lnode-flashing.md, "Bootloader
# (UF2/DFU)": 239a:0029 "Adafruit WisBlock RAK4631", drive label RAK4631.
bootloader_usb    = ["239a:0029"]
msc_label         = "RAK4631"

[board.rak4631.flashing.flash]
# Same nRF52840 layout as the T114, and measured the same way — the bootloader
# generates CURRENT.UF2 from exactly this window, and on both rig boards it
# covers 0x1000 to 0xEA000 (docs/src/concepts/lnode-flashing.md, "What a UF2 is
# allowed to write"). The application base is the one leviculum-nrf/memory.x
# links against for both binaries.
family_id      = 0xADA52840
writable_start = 0x1000
writable_end   = 0xEA000
app_base       = 0x27000

[board.rak4631.flashing.requires]
# The same constraint, for the same reason: our image is based at 0x27000 and
# cannot start on a 6.1.1 boundary. The bundle carries no SoftDevice remedy for
# this board, which is deliberate — our RAK has run 7.3.0 since we first
# flashed it, and whether a factory Pocket V2 ships something the remedy could
# repair is unmeasured. A precondition without a remedy is allowed and refuses
# with "nothing was written"; inventing a remedy path for a case nobody has
# seen is not (docs/src/concepts/lnode-flashing.md, "The SoftDevice carve-out").
softdevice = ">=7.0.1, <8.0.0"

# What a person is told when the software trigger did not work and the board
# has to be reached by hand. Per board, because the instruction that fits a
# T114 sends a Pocket V2 owner looking for a button that does not exist. A
# board that says nothing here gets the default wording in
# `lnflash::entry::double_tap_instruction`.
[board.rak4631.flashing.double_tap]
press = "double-tap the reset contact in the hidden pinhole beside the USB socket, with a needle — the second tap within about half a second of the first. This case has no RESET button on the outside."
docs  = "docs/src/firmware/recovery.md, \"WisMesh Pocket V2 (RAK4631): the hidden-pinhole caveat\""

# The SenseCAP Solar Node P1-Pro (Codeberg #233): a Seeed XIAO nRF52840 module
# on a carrier with a Wio-SX1262 radio and an L76K GNSS. It runs our firmware,
# carries traffic and answers every control command — and it is the first
# control-only entry, so it has no `flashing` section and says why below.
[board.solarnode]
family    = "nrf52840"
# Our own firmware's application ID and product string "leviculum SolarNode"
# (leviculum-nrf/src/boards/solarnode.rs:205-208). Stock Meshtastic on this
# board enumerates 2886:0059 and calls itself "XIAO-BOOT"
# (docs/src/concepts/lnode-flashing.md, "The three states a board can be in").
# That ID is deliberately not listed: a control command sent to a board running
# Meshtastic is a frame nothing there understands, and the reason to know the
# ID at all would be to knock it into a bootloader we must not write to.
candidate_usb = ["1209:0003"]
# And for the same reason the XIAO's bootloader IDs are absent too: listing
# 2886:0044 would put a mounted DFU drive in front of a tool that has no image
# it may write to it.
not_flashable = """
the Board-ID its bootloader publishes, nRF52840-SeeedXiao-v1, belongs to the \
XIAO module and not to this product. The radio sits outside the module, so any \
DIY XIAO with entirely different wiring reports the same string, and a \
manifest keyed on it would write this carrier's image onto a board whose SX1262 \
pins are elsewhere — a repair, not a retry (Codeberg #233; \
docs/src/concepts/lnode-flashing.md, "Decoupled by construction"). Flash it \
with `just flash-solarnode`, which is told the Board-ID explicitly by a person \
who can see which board is on the bench.\
"""

# The SenseCAP T1000-E (Codeberg #406): an nRF52840 with an LR1110 radio, the
# first board on the LR11xx driver. One product, one PCB, no carrier variants,
# so the Board-ID its bootloader publishes and the radio wiring belong to the
# same unit (docs/src/concepts/board-support-scope.md, "The limit that bites").
[board.t1000e]
family    = "nrf52840"
# 1209:0004 is ours (leviculum-nrf/src/boards/t1000e.rs, CONFIG). 239a:8029 is
# stock Meshtastic's, measured on the rig unit 2026-10-18; unlike stock
# firmware on the T114 it answers the 1200-baud touch.
candidate_usb = ["1209:0004", "239a:8029"]

[board.t1000e.flashing]
# `expected`: the wiring is read from Meshtastic's variant (Seeed publishes no
# schematic), and we have not run the board yet. A write needs a person to say
# yes to exactly that.
level     = "expected"
# The rig unit's bootloader publishes no UF2 volume and takes serial DFU only
# (Codeberg #452), so this board is written the way `adafruit-nrfutil dfu
# serial --singlebank` writes it (lnflash/src/dfu.rs). A unit whose bootloader
# does mount the volume still has the CDC port, so one transport serves both.
transport = "dfu-serial"
# Our firmware answers the touch (leviculum-nrf/src/usb.rs), and so does stock
# Meshtastic on this board, measured on the rig unit 2026-10-18.
entry     = ["touch-1200", "double-tap"]

[board.t1000e.flashing.identify]
# From the Adafruit_nRF52_Bootloader board definition for this product
# (boards/t1000_e) and the rig unit: Board-ID nRF52840-T1000-E-v1, volume
# label T1000-E, bootloader USB 2886:0057 ("T1000-E-BOOT").
#
# On dfu-serial the Board-ID is never read: there is no INFO_UF2.TXT to read
# it from. Identity rests on the bootloader's USB ID instead, which the
# catalogue refuses to load unless no other entry lists it (Seeed's VID, and a
# PID its bootloader uses for this product), and the `expected` level puts a
# person in front of every write on top of that.
info_uf2_board_id = "nRF52840-T1000-E-v1"
bootloader_usb    = ["2886:0057"]
msc_label         = "T1000-E"

[board.t1000e.flashing.dfu]
# The two init-packet fields the bootloader refuses an image on, the same two
# `just t1000e-dfu-package` passes to `adafruit-nrfutil dfu genpkg`
# (scripts/t1000e-dfu-package.sh):
#   device_type 0x0052  ADAFRUIT_DEVICE_TYPE; anything else is refused
#                       (Adafruit_nRF52_Bootloader, src/dfu_init.c,
#                       dfu_init_prevalidate)
#   sd_req 0x0123       the firmware ID of S140 7.3.0, the SoftDevice the unit
#                       reports; the bootloader refuses a list without the one
#                       it runs (the same function). Value from Meshtastic's
#                       boards/tracker-t1000-e.json, "sd_fwid": "0x0123".
# The bootloader checks the SoftDevice itself because this transport cannot
# read it first. `requires` below says the same thing as a version range; on
# this transport it is shown in the plan, and the bootloader's check decides.
device_type = 0x0052
sd_req      = [0x0123]

[board.t1000e.flashing.flash]
# The Adafruit nRF52840 layout every other board here has: the same
# bootloader family, S140 7.3.0, and the image linked at 0x27000
# (leviculum-nrf/memory.x). Not measured off this unit's CURRENT.UF2, which
# it does not publish.
family_id      = 0xADA52840
writable_start = 0x1000
writable_end   = 0xEA000
app_base       = 0x27000

[board.t1000e.flashing.requires]
# The rig unit reports S140 7.3.0; the constraint is the one every board on
# this image base has. No remedy is carried.
softdevice = ">=7.0.1, <8.0.0"
